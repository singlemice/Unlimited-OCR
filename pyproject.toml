[project]
name = "unlimited-ocr"
version = "2.0.0"
description = "Unlimited-OCR 2 inference client and post-processing (cross-platform: CUDA / MPS / CPU)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- Transformers (native) inference path: runs on CUDA, Apple MPS and CPU ---
    "torch>=2.13.0",
    "torchvision",
    "pillow",
    "transformers==4.52.1",
    "huggingface-hub==0.36.0",
    "tokenizers==0.21.4",
    "addict==2.4.0",
    "einops==0.8.2",
    "easydict==1.13",
    # --- SGLang serving client deps (the server itself is CUDA-only) ---
    "pymupdf==1.27.2.2",
    "fastokens==0.3.2",
    "requests",
    # --- Tests ---
    "pytest>=8.0",
]

[tool.uv]
# This repo is a collection of scripts, not an importable package.
# Tell uv not to build/install it as a distribution; just provision the deps.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
